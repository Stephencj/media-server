# UI tests for the Apple TV app, kept in their own project so the app's
# hand-kept MediaPlayer.xcodeproj stays as it is. They drive the installed app
# (com.mediaserver.tv) by bundle id. Run with ./run-ui-tests.sh.
name: MediaPlayerUITests
options:
  deploymentTarget:
    tvOS: "17.0"
targets:
  MediaPlayerUITests:
    type: bundle.ui-testing
    platform: tvOS
    sources: [MediaPlayerUITests]
    settings:
      DEVELOPMENT_TEAM: PJV7U329Q6
      PRODUCT_BUNDLE_IDENTIFIER: com.mediaserver.tv.uitests
      GENERATE_INFOPLIST_FILE: YES
schemes:
  MediaPlayerUITests:
    build:
      targets:
        MediaPlayerUITests: [test]
    test:
      targets: [MediaPlayerUITests]
