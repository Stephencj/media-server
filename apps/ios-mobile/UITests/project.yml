# UI tests for the iPhone app, in their own project so the app's hand-kept
# MediaServerMobile.xcodeproj stays as it is. They drive the installed app
# (com.mediaserver.mobile) by bundle id. Run with ./run-ui-tests.sh.
name: MediaServerMobileUITests
options:
  deploymentTarget:
    iOS: "15.0"
targets:
  ShowExtrasUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [ShowExtrasUITests]
    settings:
      DEVELOPMENT_TEAM: PJV7U329Q6
      PRODUCT_BUNDLE_IDENTIFIER: com.mediaserver.mobile.uitests
      GENERATE_INFOPLIST_FILE: YES
schemes:
  ShowExtrasUITests:
    build:
      targets:
        ShowExtrasUITests: [test]
    test:
      targets: [ShowExtrasUITests]
